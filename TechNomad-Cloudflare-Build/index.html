<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="description" content="TechNomad - Conscious Systems for Human Workflows. Digital operations, brand clarity, and web systems for founders." />
  <meta name="keywords" content="TechNomad, virtual assistant, brand design, web development, digital operations" />
  <meta name="author" content="TechNomad" />
  
  <!-- Theme Color for Mobile Browsers -->
  <meta name="theme-color" content="#00E5FF" />
  <meta name="msapplication-TileColor" content="#00010F" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://technomad.uk/" />
  <meta property="og:title" content="TechNomad - Conscious Systems for Human Workflows" />
  <meta property="og:description" content="Digital operations, brand clarity, and web systems for founders who want things to work and look right." />
  <meta property="og:image" content="/tech_nomad_logo.png" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://technomad.uk/" />
  <meta property="twitter:title" content="TechNomad - Conscious Systems for Human Workflows" />
  <meta property="twitter:description" content="Digital operations, brand clarity, and web systems for founders who want things to work and look right." />
  <meta property="twitter:image" content="/tech_nomad_logo.png" />
  
  <!-- Apple Mobile Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TechNomad" />
  
  <!-- Prevent iOS Safari from auto-detecting phone numbers -->
  <meta name="format-detection" content="telephone=no" />
  
  <title>TechNomad - Conscious Systems for Human Workflows</title>

  <!-- Favicon -->
  <link rel="icon" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" href="/icons/favicon.ico" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Preconnect to external domains for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload critical images for faster rendering -->
  <link rel="preload" href="/header_logo.png" as="image" />
  <link rel="preload" href="/header_logo_active.png" as="image" />

  <!-- Font loading with display=swap for better performance -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  
  <!-- DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
